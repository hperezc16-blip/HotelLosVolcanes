[phases.install]
cmds = ["pnpm install --no-frozen-lockfile --filter @workspace/api-server..."]

[phases.build]
cmds = ["./node_modules/.bin/esbuild artifacts/api-server/src/index.ts --bundle --platform=node --target=node18 --format=esm --outfile=artifacts/api-server/dist/index.mjs --sourcemap --packages=external"]

[start]
cmd = "node --enable-source-maps ./artifacts/api-server/dist/index.mjs"
